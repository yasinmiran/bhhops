# The stack on a laptop, under Docker: SITE=http://localhost docker compose up -d --build
# The server runs compose.prod.yml.
name: hops

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE: ${SITE:?set SITE, for example to http://localhost}
      API_UPSTREAM: api:8787
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    logging: *logging

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      # Left empty, the server makes its own and keeps it in /data/admin-token.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      - hops_data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  hops_data:
